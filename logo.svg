<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="nestGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="55%" stop-color="#8b8b8b"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="500" fill="#ffffff"/>

  <!-- Main wordmark -->
  <g fill="#000000" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="205" letter-spacing="-9">
    <text x="90" y="310">GRID</text>
    <text x="785" y="310">EST</text>
  </g>

  <!-- Stylized N / home node -->
  <g transform="translate(650,105)">
    <!-- house silhouette forming the N center -->
    <path d="M0 205 L0 92 L92 15 L184 92 L184 205 L132 205 L132 118 L52 205 Z" fill="#000000"/>

    <!-- window -->
    <g fill="#ffffff">
      <rect x="82" y="77" width="18" height="18"/>
      <rect x="104" y="77" width="18" height="18"/>
      <rect x="82" y="99" width="18" height="18"/>
      <rect x="104" y="99" width="18" height="18"/>
    </g>

    <!-- nest / compute-wave motif -->
    <path d="M18 168 C58 215, 120 222, 166 174 C135 196, 90 198, 52 178 C38 171, 27 165, 18 156 Z" fill="url(#nestGrad)"/>
    <path d="M16 151 C56 192, 119 199, 167 155 C135 176, 90 176, 50 160 C35 154, 25 149, 16 140 Z" fill="url(#nestGrad)"/>
    <path d="M21 134 C60 168, 116 172, 161 138 C132 151, 91 151, 56 141 C41 137, 31 132, 21 123 Z" fill="url(#nestGrad)"/>
  </g>

  <!-- Parent brand -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#111111">
    <text x="365" y="395" font-size="58" font-weight="300" letter-spacing="10">by</text>
    <text x="500" y="395" font-size="58" font-weight="700" letter-spacing="11">YAEL</text>
    <text x="735" y="395" font-size="58" font-weight="300" letter-spacing="12">Intelligence</text>
  </g>
</svg>
